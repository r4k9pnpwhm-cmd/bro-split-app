<style>*{box-sizing:border-box}body{margin:0;background:#06111b;color:#edf6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:850px;margin:auto;padding:16px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:26px;font-weight:800}.blue{color:#2697ff}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}.nav button,.btn,.chip,select,input,textarea{font:inherit}.nav button{background:#0d1b28;color:#b9c8d6;border:1px solid #173249;border-radius:12px;padding:10px 3px}.nav .active{background:#0c3b67;color:#fff;border-color:#1689ef}.hero{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:18px 0}.hero h1{margin:0;font-size:30px}.hero h2{margin:2px 0;color:#2a9bff}.select{background:#0d1b28;color:#fff;border:1px solid #28465e;border-radius:10px;padding:10px;width:100%}.card{background:#0c1a26;border:1px solid #19374e;border-radius:14px;margin:9px 0;overflow:hidden}.cardhead{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:12px}.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#168cf0;font-weight:800}.name{font-weight:750}.small{font-size:12px;color:#a8bac9}.last{text-align:right;font-size:12px;color:#c8d6e2}.detail{padding:0 14px 14px;border-top:1px solid #173249}.recommend{background:#0b2527;border:1px solid #17685d;padding:12px;border-radius:10px;margin:12px 0;color:#59efae;font-weight:700}.setrow{display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:7px;margin:8px 0;align-items:center}.setrow input,input,textarea{width:100%;background:#102434;color:#fff;border:1px solid #2b4c64;border-radius:9px;padding:11px}.labels{font-size:11px;color:#9fb2c1}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{background:#11283a;color:#fff;border:1px solid #31506a;border-radius:999px;padding:8px 12px}.btn{width:100%;border:1px solid #168cf0;border-radius:12px;padding:13px;background:#118cf2;color:white;font-weight:750;margin:8px 0}.btn.secondary{background:transparent}.btn.danger{border-color:#6d2e34;background:#30171b}.add{border-style:dashed;background:transparent}.panel{background:#0c1a26;border:1px solid #19374e;border-radius:14px;padding:14px;margin:10px 0}.search{margin:8px 0}.libitem{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #173249;padding:11px 2px}.libitem:last-child{border:0}.tabs{display:flex;gap:6px;overflow:auto}.hidden{display:none}.historyrow{padding:10px 0;border-bottom:1px solid #173249}.metric{font-size:28px;font-weight:800}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#173d31;padding:12px 18px;border-radius:10px;z-index:5}.modal{position:fixed;inset:0;background:#02070bbd;display:grid;place-items:end center;z-index:4}.sheet{width:min(850px,100%);max-height:88vh;overflow:auto;background:#091722;border:1px solid #23445d;border-radius:18px 18px 0 0;padding:16px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.shell{padding:12px 10px 90px}.brand{font-size:22px}.nav button{font-size:11px}.hero{display:block}.hero h1{font-size:27px}.last{max-width:145px}.setrow{grid-template-columns:24px 1fr 1fr 1fr}.desktoplabel{display:none}}</style>

<script>window.BRO_SPLIT_SEED={"plan":{"Monday":{"focus":"Chest","exercises":[{"name":"Barbell Bench Press","equipment":"Barbell","setup":"Flat Bench","sets":3,"reps":"6-10","rpe":"7-9","rir":"1-3","rest":120,"notes":"Primary heavy press"},{"name":"Incline Dumbbell Press","equipment":"Dumbbells","setup":"Incline Bench","sets":3,"reps":"8-12","rpe":"7-9","rir":"1-3","rest":90,"notes":"Controlled range of motion"},{"name":"Cable Fly","equipment":"Double Cable","setup":"Cable Machine","sets":3,"reps":"10-15","rpe":"8-9","rir":"1-2","rest":60,"notes":"Keep tension on chest"},{"name":"Single-Arm Cable Chest Press","equipment":"Single Cable","setup":"Cable Machine","sets":3,"reps":"8-12","rpe":"8-9","rir":"1-2","rest":75,"notes":"Replacement for selectorized chest press; free cable path"},{"name":"Low-to-High Cable Fly","equipment":"Double Cable","setup":"Cable Machine","sets":2,"reps":"12-15","rpe":"8-9","rir":"1-2","rest":60,"notes":"Upper-chest emphasis"}]},"Tuesday":{"focus":"Arms","exercises":[{"name":"EZ-Bar or Barbell Curl","equipment":"Barbell","setup":"Other","sets":3,"reps":"8-12","rpe":"7-9","rir":"1-3","rest":75,"notes":"Avoid swinging"},{"name":"Cable Triceps Pressdown","equipment":"Single Cable","setup":"Cable Machine","sets":3,"reps":"8-12","rpe":"7-9","rir":"1-3","rest":75,"notes":"Elbows stay controlled"},{"name":"Incline Dumbbell Curl","equipment":"Dumbbells","setup":"Incline Bench","sets":3,"reps":"10-12","rpe":"8-9","rir":"1-2","rest":60,"notes":"Full stretch"},{"name":"Overhead Cable Triceps Extension","equipment":"Single Cable","setup":"Cable Machine","sets":3,"reps":"10-15","rpe":"8-9","rir":"1-2","rest":60,"notes":"Long-head triceps emphasis"},{"name":"Hammer Curl","equipment":"Dumbbells","setup":"Other","sets":2,"reps":"10-15","rpe":"8-9","rir":"1-2","rest":60,"notes":"Neutral grip"},{"name":"Cable Curl","equipment":"Single Cable","setup":"Cable Machine","sets":2,"reps":"12-15","rpe":"8-9","rir":"1-2","rest":60,"notes":"Pump/finisher"}]},"Wednesda },{"name":"Leg Extension","equipment":"Selectorized Machine","setup":"Leg Extension","sets":2,"reps":"12-15","rpe":"8-9","rir":"1-2","rest":60,"notes":"Quad finisher"},{"name":"Calf Raise","equipment":"Plate-Loaded Machine","setup":"Other","sets":3,"reps":"10-15","rpe":"8-9","rir":"1-2","rest":60,"notes":"Pause at stretch and top"}]},"Friday":{"focus":"Full Body / Pump","exercises":[{"name":"Incline Dumbbell Press","equipment":"Dumbbells","setup":"Incline Bench","sets":2,"reps":"10-15","rpe":"7-8","rir":"2-3","rest":60,"notes":"Moderate load; do not grind"},{"name":"Lat Pulldown","equipment":"Selectorized Machine","setup":"Lat Pulldown","sets":2,"reps":"10-15","rpe":"7-8","rir":"2-3","rest":60,"notes":"Smooth controlled reps"},{"name":"Goblet Squat or Leg Press","equipment":"Dumbbells","setup":"Leg Press","sets":2,"reps":"10-15","rpe":"7-8","rir":"2-3","rest":60,"notes":"Keep fatigue moderate"},{"name":"Seated Cable Row","equipment":"Double Cable","setup":"Seated Row","sets":2,"reps":"10-15","rpe":"7-8","rir":"2-3","rest":60,"notes":"Moderate pump work"},{"name":"Dumbbell Lateral Raise","equipment":"Dumbbells","setup":"Other","sets":2,"reps":"12-20","rpe":"8","rir":"2","rest":45,"notes":"Shoulder pump"},{"name":"Cable Curl + Triceps Pressdown","equipment":"Single Cable","setup":"Cable Machine","sets":2,"reps":"12-15 each","rpe":"8","rir":"2","rest":45,"notes":"Superset to save time"}]}},"history":[],"extras":[],"library":[{"name":"Barbell Bench Press","muscle":"Chest","equipment":"Barbell","reps":"6-10"},{"name":"Incline Dumbbell Press","muscle":"Chest","equipment":"Dumbbells","reps":"10-15"},{"name":"Flat Dumbbell Press","muscle":"Chest","equipment":"Other","reps":"8-12"},{"name":"Push-Up","muscle":"Chest","equipment":"Other","reps":"8-12"},{"name":"Cable Fly","muscle":"Chest","equipment":"Double Cable","reps":"10-15"},{"name":"Low-to-High Cable Fly","muscle":"Chest","equipment":"Double Cable","reps":"12-15"},{"name":"High-to-Low Cable Fly","muscle":"Chest","equipment":"Other","reps":"8-12"},{"name":"Single-Arm Cable Chest Press","muscle":"Chest","equipment":"Single Cable","reps":"8-12"},{"name":"Dumbbell Fly","muscle":"Chest","equipment":"Other","reps":"8-12"},{"name":"Dumbbell Pullover","muscle":"Chest","equipment":"Other","reps":"8-12"},{"name":"Lat Pulldown","muscle":"Back","equipment":"Selectorized Machine","reps":"10-15"},{"name":"Neutral-Grip Pulldown","muscle":"Back","equipment":"Other","reps":"8-12"},{"name":"Single-Arm Cable Lat Pulldown","muscle":"Back","equipment":"Single Cable","reps":"10-15"},{"name":"Seated Cable Row","muscle":"Back","equipment":"Double Cable","reps":"10-15"},{"name":"Chest-Supported Dumbbell Row","muscle":"Back","equipment":"Dumbbells","reps":"8-12"},{"name":"Single-Arm Dumbbell Row","muscle":"Back","equipment":"Other","reps":"8-12"},{"name":"Straight-Arm Pulldown","muscle":"Back","equipment":"Single Cable","reps":"12-15"},{"name":"Pull-Up","muscle":"Back","equipment":"Other","reps":"8-12"},{"name":"Chin-Up","muscle":"Back","equipment":"Other","reps":"8-12"},{"name":"T-Bar Row","muscle":"Back","equipment":"Other","reps":"8-12"},{"name":"Landmine Row","muscle":"Back","equipment":"Other","reps":"8-12"},{"name":"Barbell Row","muscle":"Back","equipment":"Other","reps":"8-12"},{"name":"Cable Lateral Raise","muscle":"Shoulders","equipment":"Single Cable","reps":"12-15"},{"name":"Dumbbell Lateral Raise","muscle":"Shoulders","equipment":"Dumbbells","reps":"12-20"},{"name":"Cable Rear-Delt Fly","muscle":"Shoulders","equipment":"Double Cable","reps":"12-15"},{"name":"Reverse Dumbbell Fly","muscle":"Shoulders","equipment":"Other","reps":"8-12"},{"name":"Face Pull","muscle":"Shoulders","equipment":"Other","reps":"8-12"},{"name":"Dumbbell Shoulder Press","muscle":"Shoulders","equipment":"Other","reps":"8-12"},{"name":"Landmine Press","muscle":"Shoulders","equipment":"Other","reps":"8-12"},{"name":"Front Raise","muscle":"Shoulders","equipment":"Other","reps":"8-12"},{"name":"EZ-Bar Curl","muscle":"Arms","equipment":"Other","reps":"8-12"},{"name":"Barbell Curl","muscle":"Arms","equipment":"Other","reps":"8-12"},{"name":"Incline Dumbbell Curl","muscle":"Arms","equipment":"Dumbbells","reps":"10-12"},{"name":"Hammer Curl","muscle":"Arms","equipment":"Dumbbells","reps":"10-15"},{"name":"Cable Curl","muscle":"Arms","equipment":"Single Cable","reps":"12-15"},{"name":"Preacher Curl","muscle":"Arms","equipment":"Other","reps":"8-12"},{"name":"Concentration Curl","muscle":"Arms","equipment":"Other","reps":"8-12"},{"name":"Cable Triceps Pressdown","muscle":"Arms","equipment":"Single Cable","reps":"8-12"},{"name":"Rope Pressdown","muscle":"Arms","equipment":"Other","reps":"8-12"},{"name":"Overhead Cable Triceps Extension","muscle":"Arms","equipment":"Single Cable","reps":"10-15"},{"name":"Dumbbell Overhead Triceps Extension","muscle":"Arms","equipment":"Other","reps":"8-12"},{"name":"Close-Grip Push-Up","muscle":"Arms","equipment":"Other","reps":"8-12"},{"name":"Back Squat","muscle":"Legs","equipment":"Other","reps":"8-12"},{"name":"Hack Squat","muscle":"Legs","equipment":"Other","reps":"8-12"},{"name":"Goblet Squat","muscle":"Legs","equipment":"Other","reps":"8-12"},{"name":"Romanian Deadlift","muscle":"Legs","equipment":"Barbell","reps":"8-12"},{"name":"Leg Press","muscle":"Legs","equipment":"Plate-Loaded Machine","reps":"10-15"},{"name":"Leg Curl","muscle":"Legs","equipment":"Selectorized Machine","reps":"10-15"},{"name":"Seated Leg Curl","muscle":"Legs","equipment":"Other","reps":"8-12"},{"name":"Leg Extension","muscle":"Legs","equipment":"Selectorized Machine","reps":"12-15"},{"name":"Walking Lunge","muscle":"Legs","equipment":"Other","reps":"8-12"},{"name":"Bulgarian Split Squat","muscle":"Legs","equipment":"Other","reps":"8-12"},{"name":"Calf Raise","muscle":"Legs","equipment":"Plate-Loaded Machine","reps":"10-15"},{"name":"Hip Thrust","muscle":"Legs","equipment":"Other","reps":"8-12"},{"name":"Kneeling Cable Crunch","muscle":"Core","equipment":"Other","reps":"8-12"},{"name":"Plank","muscle":"Core","equipment":"Other","reps":"8-12"},{"name":"Hanging Knee Raise","muscle":"Core","equipment":"Other","reps":"8-12"},{"name":"Hanging Leg Raise","muscle":"Core","equipment":"Other","reps":"8-12"},{"name":"Ab Wheel Rollout","muscle":"Core","equipment":"Other","reps":"8-12"},{"name":"Pallof Press","muscle":"Core","equipment":"Other","reps":"8-12"},{"name":"EZ-Bar or Barbell Curl","muscle":"Arms","equipment":"Barbell","reps":"8-12"},{"name":"Back Squat or Hack Squat","muscle":"Legs","equipment":"Barbell","reps":"6-10"},{"name":"Goblet Squat or Leg Press","muscle":"Full Body / Pump","equipment":"Dumbbells","reps":"10-15"},{"name":"Cable Curl + Triceps Pressdown","muscle":"Full Body / Pump","equipment":"Single Cable","reps":"12-15 each"}]};</script>
<script>const SEED=window.BRO_SPLIT_SEED, KEY='broSplitV1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(SEED));
if(!db.today) db.today={}; if(!db.recent) db.recent=[];
let view='today', openIdx=0, selectedDay=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];
if(!db.plan[selectedDay]) selectedDay='Monday';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(db))} function lastSets(name){let h=db.history.filter(x=>x.exercise===name); if(!h.length)return[];let d=h.map(x=>x.date).sort().pop();return h.filter(x=>x.exercise===name&&x.date===d).sort((a,b)=>a.set-b.set)}
function lastText(name){let a=lastSets(name);return a.length?a.map(x=>`${x.weight??'BW'} × ${x.reps}`).join(' | '):'No previous data'}
function rec(ex){let a=lastSets(ex.name);if(!a.length)return'Build baseline';let [lo,hi]=String(ex.reps).split('-').map(Number);let reps=a.map(x=>+x.reps||0),rpe=a.map(x=>+x.rpe||0).filter(Boolean);if(reps.length&&reps.every(r=>r>=hi-1)&&(!rpe.length||Math.max(...rpe)<=9))return'Increase weight';if(reps.some(r=>r<lo))return'Hold weight / recover';return'Try for more reps'}
function shell(body){return `<div class=shell><div class=top><div class=brand>🏋️ <span>Bro Split</span></div><div class=small>${new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</div></div><div class=nav>${[['today','Today'],['history','History'],['progress','Progress'],['exercises','Exercises'],['settings','Settings']].map(([v,l])=>`<button data-view=${v} class=${view===v?'active':''}>${l}</button>`).join('')}</div>${body}</div>`}
function render(){let body=view==='today'?today():view==='history'?history():view==='progress'?progress():view==='exercises'?library():settings();$('#app').innerHTML=shell(body);bind()}
function today(){let p=db.plan[selectedDay];let exs=p.exercises;return `<div class=hero><div><h1>${selectedDay.toUpperCase()}</h1><h2>${esc(p.focus)}</h2></div><div style="min-width:220px"><select id=day class=select>${Object.keys(db.plan).map(d=>`<option ${d===selectedDay?'selected':''}>${d}</option>`).join('')}</select></div></div>${exs.map((e,i)=>card(e,i)).join('')}<button class="btn add" id=add>＋ Add Exercise</button><button class=btn id=complete>✓ Complete Workout</button>`}
function card(e,i){let sets=lastSets(e.name), t=db.today[selectedDay]?.[e.name]||Array.from({length:e.sets},()=>({}));return `<div class=card><div class=cardhead data-open=${i}><div class=num>${i+1}</div><div><div class=name>${esc(e.name)}</div><div class=small>${e.sets} × ${esc(e.reps)}</div></div><div class=last>Last:<br>${esc(lastText(e.name))}<br><span style="color:#249cff">${i===openIdx?'▲':'▼'}</span></div></div>${i===openIdx?`<div class=detail><div class=recommend>↑ ${rec(e)}</div><div class="setrow labels"><b>Set</b><b>Weight</b><b>Reps</b><b>RPE</b></div>${Array.from({length:e.sets},(_,j)=>`<div class=setrow><b>${j+1}</b><input inputmode=decimal data-f=weight data-i=${j} value="${t[j]?.weight??''}" placeholder="${sets[j]?.weight??''}"><input inputmode=numeric data-f=reps data-i=${j} value="${t[j]?.reps??''}" placeholder="${sets[j]?.reps??''}"><input inputmode=decimal data-f=rpe data-i=${j} value="${t[j]?.rpe??''}" placeholder="8"></div>`).join('')}<div class=controls><button class=chip id=super>Superset: ${t[0]?.superset?'Yes':'No'}</button><button class=chip id=replace>Replace Exercise</button></div><textarea id=notes placeholder="Notes (optional)">${esc(t[0]?.notes||'')}</textarea><button class=btn id=saveex>Save Exercise</button></div>`:''}</div>`}
function history(){let dates=[...new Set(db.history.map(x=>x.date))].sort().reverse();return `<h1>History</h1>${dates.slice(0,30).map(d=>{let rows=db.history.filter(x=>x.date===d),ses=[...new Set(rows.map(x=>x.session))].join(', ');return `<div class=panel><b>${d}</b><div class=small>${esc(ses)}</div>${[...new Set(rows.map(x=>x.exercise))].map(e=>`<div class=historyrow><b>${esc(e)}</b><div class=small>${esc(rows.filter(x=>x.exercise===e).map(x=>`${x.weight??'BW'}×${x.reps}`).join(' | '))}</div></div>`).join('')}</div>`}).join('')}`}
function progress(){let names=[...new Set(db.history.map(x=>x.exercise))].sort();let n=names[0],h=db.history.filter(x=>x.exercise===n);let best=h.reduce((m,x)=>Math.max(m,(+x.weight||0)*(1+(+x.reps||0)/30)),0);return `<h1>Progress</h1><div class=panel><select id=prog class=select>${names.map(x=>`<option>${esc(x)}</option>`).join('')}</select><p class=small>Exercise-specific history is preserved even when you change the program.</p><div class=metric>${Math.round(best)||'—'}</div><div class=small>Best estimated 1RM for selected exercise</div></div><div class=panel><b>V1 Progress</b><p class=small>Kept intentionally simple for testing. Detailed time-range charts can wait until actual use proves we need them.</p></div>`}
function library(){let groups=[...new Set(db.library.map(x=>x.muscle))];return `<h1>Exercises</h1><input id=search class=search placeholder="Search exercises…">${groups.map(g=>`<div class=panel><b>${g}</b>${db.library.filter(x=>x.muscle===g).map(x=>`<div class=libitem><span>${esc(x.name)}<div class=small>${esc(x.equipment)} • ${esc(x.reps)}</div></span></div>`).join('')}</div>`).join('')}<button class=btn id=create>＋ Create Exercise</button>`}
function settings(){return `<h1>Settings</h1><div class=panel><b>Data</b><button class=btn id=export>Export Backup</button><label class="btn secondary" style="display:block;text-align:center">Import Backup<input id=import type=file accept=.json hidden></label></div><div class=panel><b>About</b><p class=small>Bro Split V1 • Local-first workout tracker. Your entries are stored in this browser unless you export them.</p></div>`}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()}); if(view==='today'){ $('#day').onchange=e=>{selectedDay=e.target.value;openIdx=0;render()};document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{openIdx=+x.dataset.open;render()}); $('#add').onclick=()=>picker('add'); $('#complete').onclick=complete; let e=db.plan[selectedDay].exercises[openIdx]; if($('#replace'))$('#replace').onclick=()=>picker('replace'); if($('#saveex'))$('#saveex').onclick=()=>saveExercise(e); if($('#super'))$('#super').onclick=()=>toggleSuper(e)} if(view==='exercises'){ $('#search').oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.libitem').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'flex':'none')};$('#create').onclick=()=>createForm()} if(view==='settings'){ $('#export').onclick=exportData;$('#import').onchange=importData}}
function ensureToday(e){db.today[selectedDay]??={};db.today[selectedDay][e.name]??=Array.from({length:e.sets},()=>({}));return db.today[selectedDay][e.name]}
function saveExercise(e){let t=ensureToday(e);document.querySelectorAll('[data-f]').forEach(x=>{t[+x.dataset.i][x.dataset.f]=x.value});let notes=$('#notes').value;t.forEach(x=>x.notes=notes);save();toast('Exercise saved')}
function toggleSuper(e){let t=ensureToday(e),v=!t[0].superset;t.forEach(x=>x.superset=v);save();render()}
function picker(mode){let modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class=sheet><h2>${mode==='add'?'Add':'Replace'} Exercise</h2><input id=picksearch placeholder="Search exercises…"><div id=picklist>${db.library.map((x,i)=>`<div class=libitem data-pick=${i}><span><b>${esc(x.name)}</b><div class=small>${esc(x.muscle)} • ${esc(x.equipment)}</div></span><span>＋</span></div>`).join('')}</div><button class="btn secondary" id=newx>＋ Create New Exercise</button><button class="btn secondary" id=cancel>Cancel</button></div>`;document.body.append(modal);modal.querySelector('#cancel').onclick=()=>modal.remove();modal.querySelector('#picksearch').oninput=e=>modal.querySelectorAll('[data-pick]').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'flex':'none');modal.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>choose(mode,db.library[+x.dataset.pick],modal));modal.querySelector('#newx').onclick=()=>{modal.remove();createForm(mode)}}
function choose(mode,x,modal){let e={name:x.name,equipment:x.equipment,setup:'',sets:3,reps:x.reps,rpe:'8-9',rir:'1-2',rest:60,notes:''};if(mode==='add'){db.plan[selectedDay].exercises.push(e);db.recent.unshift(x.name);save();modal.remove();openIdx=db.plan[selectedDay].exercises.length-1;render();return}modal.querySelector('.sheet').innerHTML=`<h2>${esc(x.name)}</h2><p class=small>${esc(x.muscle)} • ${esc(x.equipment)}</p><button class=btn id=todayonly>Just Today</button><button class="btn secondary" id=program>Update Program</button><button class="btn secondary" id=cancel2>Cancel</button>`;modal.querySelector('#todayonly').onclick=()=>{let old=db.plan[selectedDay].exercises[openIdx];db.plan[selectedDay].exercises[openIdx]={...e,_temporaryOriginal:old};save();modal.remove();render()};modal.querySelector('#program').onclick=()=>{db.plan[selectedDay].exercises[openIdx]=e;save();modal.remove();render()};modal.querySelector('#cancel2').onclick=()=>modal.remove()}
function createForm(mode='add'){let modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class=sheet><h2>Create Exercise</h2><input id=xname placeholder="Exercise name"><div class=row2><select id=xmus class=select>${['Chest','Back','Shoulders','Arms','Legs','Core'].map(x=>`<option>${x}</option>`).join('')}</select><input id=xeq placeholder="Equipment"></div><div class=row2><input id=xlo inputmode=numeric placeholder="Min reps e.g. 8"><input id=xhi inputmode=numeric placeholder="Max reps e.g. 12"></div><button class=btn id=xsave>Create Exercise</button><button class="btn secondary" id=xcancel>Cancel</button></div>`;document.body.append(modal);modal.querySelector('#xcancel').onclick=()=>modal.remove();modal.querySelector('#xsave').onclick=()=>{let x={name:modal.querySelector('#xname').value.trim(),muscle:modal.querySelector('#xmus').value,equipment:modal.querySelector('#xeq').value.trim()||'Other',reps:`${modal.querySelector('#xlo').value||8}-${modal.querySelector('#xhi').value||12}`};if(!x.name)return;db.library.push(x);save();modal.remove();picker(mode)}}
function complete(){let entries=db.today[selectedDay]||{},date=new Date().toISOString().slice(0,10);Object.entries(entries).forEach(([exercise,sets])=>sets.forEach((s,i)=>{if(s.reps)db.history.push({date,session:db.plan[selectedDay].focus,exercise,set:i+1,weight:s.weight?+s.weight:null,reps:+s.reps,rpe:s.rpe?+s.rpe:null,notes:s.notes||'',superset:s.superset?'Yes':'No'})}));db.plan[selectedDay].exercises=db.plan[selectedDay].exercises.map(e=>e._temporaryOriginal||e);delete db.today[selectedDay];save();toast('Workout completed and saved');render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='bro-split-backup.json';a.click()}
function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();toast('Backup imported')}catch(e){alert('Invalid backup file')}};r.readAsText(f)}
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),1800)}
render();
</script>
</body></html>
