<style>*{box-sizing:border-box}body{margin:0;background:#06111b;color:#edf6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:850px;margin:auto;padding:16px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:26px;font-weight:800}.blue{color:#2697ff}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}.nav button,.btn,.chip,select,input,textarea{font:inherit}.nav button{background:#0d1b28;color:#b9c8d6;border:1px solid #173249;border-radius:12px;padding:10px 3px}.nav .active{background:#0c3b67;color:#fff;border-color:#1689ef}.hero{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:18px 0}.hero h1{margin:0;font-size:30px}.hero h2{margin:2px 0;color:#2a9bff}.select{background:#0d1b28;color:#fff;border:1px solid #28465e;border-radius:10px;padding:10px;width:100%}.card{background:#0c1a26;border:1px solid #19374e;border-radius:14px;margin:9px 0;overflow:hidden}.cardhead{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:12px}.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#168cf0;font-weight:800}.name{font-weight:750}.small{font-size:12px;color:#a8bac9}.last{text-align:right;font-size:12px;color:#c8d6e2}.detail{padding:0 14px 14px;border-top:1px solid #173249}.recommend{background:#0b2527;border:1px solid #17685d;padding:12px;border-radius:10px;margin:12px 0;color:#59efae;font-weight:700}.setrow{display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:7px;margin:8px 0;align-items:center}.setrow input,input,textarea{width:100%;background:#102434;color:#fff;border:1px solid #2b4c64;border-radius:9px;padding:11px}.labels{font-size:11px;color:#9fb2c1}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{background:#11283a;color:#fff;border:1px solid #31506a;border-radius:999px;padding:8px 12px}.btn{width:100%;border:1px solid #168cf0;border-radius:12px;padding:13px;background:#118cf2;color:white;font-weight:750;margin:8px 0}.btn.secondary{background:transparent}.btn.danger{border-color:#6d2e34;background:#30171b}.add{border-style:dashed;background:transparent}.panel{background:#0c1a26;border:1px solid #19374e;border-radius:14px;padding:14px;margin:10px 0}.search{margin:8px 0}.libitem{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #173249;padding:11px 2px}.libitem:last-child{border:0}.tabs{display:flex;gap:6px;overflow:auto}.hidden{display:none}.historyrow{padding:10px 0;border-bottom:1px solid #173249}.metric{font-size:28px;font-weight:800}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#173d31;padding:12px 18px;border-radius:10px;z-index:5}.modal{position:fixed;inset:0;background:#02070bbd;display:grid;place-items:end center;z-index:4}.sheet{width:min(850px,100%);max-height:88vh;overflow:auto;background:#091722;border:1px solid #23445d;border-radius:18px 18px 0 0;padding:16px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.shell{padding:12px 10px 90px}.brand{font-size:22px}.nav button{font-size:11px}.hero{display:block}.hero h1{font-size:27px}.last{max-width:145px}.setrow{grid-template-columns:24px 1fr 1fr 1fr}.desktoplabel{display:none}}.muted{color:#9fb2c1}.mini{font-size:12px;padding:8px 10px}.skip{border-color:#6c5262;color:#f0c3cc}.note{font-size:12px;color:#b9d4e8;margin:8px 0}.bodygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:14px 0}.bodygrid label{display:block}.bodygrid input{margin-top:5px}</style>

y":{"focus":"Back + Shoulders","exercises":[{"name":"Lat Pulldown","equipment":"Selectorized Machine","setup":"Lat Pulldown","sets":3,"reps":"6-10","rpe":"7-9","rir":"1-3","rest":90,"notes":"Drive elbows down"},{"name":"Seated Cable Row","equipment":"Double Cable","setup":"Seated Row","sets":3,"reps":"8-12","rpe":"7-9","rir":"1-3","rest":90,"notes":"Pause briefly at contraction"},{"name":"Chest-Supported Dumbbell Row","equipment":"Dumbbells","setup":"Incline Bench","sets":3,"reps":"8-12","rpe":"8-9","rir":"1-2","rest":75,"notes":"Reduce lower-back fatigue"},{"name":"Single-Arm Cable Lat Pulldown","equipment":"Single Cable","setup":"Cable Machine","sets":3,"reps":"10-15","rpe":"8-9","rir":"1-2","rest":60,"notes":"Work each side independently"},{"name":"Straight-Arm Pulldown","equipment":"Single Cable","setup":"Cable Machine","sets":2,"reps":"12-15","rpe":"8-9","rir":"1-2","rest":60,"notes":"Lat-focused finisher"},{"name":"Cable Lateral Raise","equipment":"Single Cable","setup":"Cable Machine","sets":2,"reps":"12-15","rpe":"8","rir":"2","rest":45,"notes":"Side-delt work; controlled reps"},{"name":"Cable Rear-Delt Fly","equipment":"Double Cable","setup":"Cable Machine","sets":2,"reps":"12-15","rpe":"8","rir":"2","rest":45,"notes":"Rear-delt work; keep load controlled"}]},"Thursday":{"focus":"Legs","exercises":[{"name":"Back Squat or Hack Squat","equipment":"Barbell","setup":"Squat Rack","sets":3,"reps":"6-10","rpe":"7-9","rir":"1-3","rest":120,"notes":"Use Hack Squat if preferred"},{"name":"Romanian Deadlift","equipment":"Barbell","setup":"Other","sets":3,"reps":"8-12","rpe":"7-9","rir":"1-3","rest":120,"notes":"Hamstrings/glutes; controlled eccentric"},{"name":"Leg Press","equipment":"Plate-Loaded Machine","setup":"Leg Press","sets":3,"reps":"10-15","rpe":"8-9","rir":"1-2","rest":90,"notes":"Controlled depth"},{"name":"Leg Curl","equipment":"Selectorized Machine","setup":"Leg Curl","sets":3,"reps":"10-15","rpe":"8-9","rir":"1-2","rest":60,"notes":"Hamstring isolation"},{"name":"Leg Extension","equipment":"Selectorized Machine","setup":"Leg Extension","sets":2,"reps":"12-15","rpe":"8-9","rir":"1-2","rest":60,"notes":"Quad finisher"},{"name":"Calf Raise","equipment":"Plate-Loaded Machine","setup":"Other","sets":3,"reps":"10-15","rpe":"8-9","rir":"1-2","rest":60,"notes":"Pause at stretch and top"}]},"Friday":{"focus":"Full Body / Pump","exercises":[{"name":"Incline Dumbbell Press","equipment":"Dumbbells","setup":"Incline Bench","sets":2,"reps":"10-15","rpe":"7-8","rir":"2-3","rest":60,"notes":"Moderate load; do not grind"},{"name":"Lat Pulldown","equipment":"Selectorized Machine","setup":"Lat Pulldown","sets":2,"reps":"10-15","rpe":"7-8","rir":"2-3","rest":60,"notes":"Smooth controlled reps"},{"name":"Goblet Squat or Leg Press","equipment":"Dumbbells","setup":"Leg Press","sets":2,"reps":"10-15","rpe":"7-8","rir":"2-3","rest":60,"notes":"Keep fatigue moderate"},{"name":"Seated Cable Row","equipment":"Double Cable","setup":"Seated Row","sets":2,"reps":"10-15","rpe":"7-8","rir":"2-3","rest":60,"notes":"Moderate pump work"},{"name":"Dumbbell Lateral Raise","equipment":"Dumbbells","setup":"Other","sets":2,"reps":"12-20","rpe":"8","rir":"2","rest":45,"notes":"Shoulder pump"},{"name":"Cable Curl","equipment":"Single Cable","setup":"Cable Machine","sets":2,"reps":"12-15","rpe":"8","rir":"2","rest":45,"notes":"Optional superset with pressdowns"},{"name":"Cable Triceps Pressdown","equipment":"Single Cable","setup":"Cable Machine","sets":2,"reps":"12-15","rpe":"8","rir":"2","rest":45,"notes":"Optional superset with curls"}]}},"history":[],"extras":[],"library":[{"name":"Barbell Bench Press","muscle":"Chest","equipment":"Barbell","reps":"6-10"},{"name":"Incline Dumbbell Press","muscle":"Chest","equipment":"Dumbbells","reps":"10-15"},{"name":"Flat Dumbbell Press","muscle":"Chest","equipment":"Other","reps":"8-12"},{"name":"Push-Up","muscle":"Chest","equipment":"Other","reps":"8-12"},{"name":"Cable Fly","muscle":"Chest","equipment":"Double Cable","reps":"10-15"},{"name":"Low-to-High Cable Fly","muscle":"Chest","equipment":"Double Cable","reps":"12-15"},{"name":"High-to-Low Cable Fly","muscle":"Chest","equipment":"Other","reps":"8-12"},{"name":"Single-Arm Cable Chest Press","muscle":"Chest","equipment":"Single Cable","reps":"8-12"},{"name":"Dumbbell Fly","muscle":"Chest","equipment":"Other","reps":"8-12"},{"name":"Dumbbell Pullover","muscle":"Chest","equipment":"Other","reps":"8-12"},{"name":"Lat Pulldown","muscle":"Back","equipment":"Selectorized Machine","reps":"10-15"},{"name":"Neutral-Grip Pulldown","muscle":"Back","equipment":"Other","reps":"8-12"},{"name":"Single-Arm Cable Lat Pulldown","muscle":"Back","equipment":"Single Cable","reps":"10-15"},{"name":"Seated Cable Row","muscle":"Back","equipment":"Double Cable","reps":"10-15"},{"name":"Chest-Supported Dumbbell Row","muscle":"Back","equipment":"Dumbbells","reps":"8-12"},{"name":"Single-Arm Dumbbell Row","muscle":"Back","equipment":"Other","reps":"8-12"},{"name":"Straight-Arm Pulldown","muscle":"Back","equipment":"Single Cable","reps":"12-15"},{"name":"Pull-Up","muscle":"Back","equipment":"Other","reps":"8-12"},{"name":"Chin-Up","muscle":"Back","equipment":"Other","reps":"8-12"},{"name":"T-Bar Row","muscle":"Back","equipment":"Other","reps":"8-12"},{"name":"Landmine Row","muscle":"Back","equipment":"Other","reps":"8-12"},{"name":"Barbell Row","muscle":"Back","equipment":"Other","reps":"8-12"},{"name":"Cable Lateral Raise","muscle":"Shoulders","equipment":"Single Cable","reps":"12-15"},{"name":"Dumbbell Lateral Raise","muscle":"Shoulders","equipment":"Dumbbells","reps":"12-20"},{"name":"Cable Rear-Delt Fly","muscle":"Shoulders","equipment":"Double Cable","reps":"12-15"},{"name":"Reverse Dumbbell Fly","muscle":"Shoulders","equipment":"Other","reps":"8-12"},{"name":"Face Pull","muscle":"Shoulders","equipment":"Other","reps":"8-12"},{"name":"Dumbbell Shoulder Press","muscle":"Shoulders","equipment":"Other","reps":"8-12"},{"name":"Landmine Press","muscle":"Shoulders","equipment":"Other","reps":"8-12"},{"name":"Front Raise","muscle":"Shoulders","equipment":"Other","reps":"8-12"},{"name":"EZ-Bar Curl","muscle":"Arms","equipment":"Other","reps":"8-12"},{"name":"Barbell Curl","muscle":"Arms","equipment":"Other","reps":"8-12"},{"name":"Incline Dumbbell Curl","muscle":"Arms","equipment":"Dumbbells","reps":"10-12"},{"name":"Hammer Curl","muscle":"Arms","equipment":"Dumbbells","reps":"10-15"},{"name":"Cable Curl","muscle":"Arms","equipment":"Single Cable","reps":"12-15"},{"name":"Preacher Curl","muscle":"Arms","equipment":"Other","reps":"8-12"},{"name":"Concentration Curl","muscle":"Arms","equipment":"Other","reps":"8-12"},{"name":"Cable Triceps Pressdown","muscle":"Arms","equipment":"Single Cable","reps":"8-12"},{"name":"Rope Pressdown","muscle":"Arms","equipment":"Other","reps":"8-12"},{"name":"Overhead Cable Triceps Extension","muscle":"Arms","equipment":"Single Cable","reps":"10-15"},{"name":"Dumbbell Overhead Triceps Extension","muscle":"Arms","equipment":"Other","reps":"8-12"},{"name":"Close-Grip Push-Up","muscle":"Arms","equipment":"Other","reps":"8-12"},{"name":"Back Squat","muscle":"Legs","equipment":"Other","reps":"8-12"},{"name":"Hack Squat","muscle":"Legs","equipment":"Other","reps":"8-12"},{"name":"Goblet Squat","muscle":"Legs","equipment":"Other","reps":"8-12"},{"name":"Romanian Deadlift","muscle":"Legs","equipment":"Barbell","reps":"8-12"},{"name":"Leg Press","muscle":"Legs","equipment":"Plate-Loaded Machine","reps":"10-15"},{"name":"Leg Curl","muscle":"Legs","equipment":"Selectorized Machine","reps":"10-15"},{"name":"Seated Leg Curl","muscle":"Legs","equipment":"Other","reps":"8-12"},{"name":"Leg Extension","muscle":"Legs","equipment":"Selectorized Machine","reps":"12-15"},{"name":"Walking Lunge","muscle":"Legs","equipment":"Other","reps":"8-12"},{"name":"Bulgarian Split Squat","muscle":"Legs","equipment":"Other","reps":"8-12"},{"name":"Calf Raise","muscle":"Legs","equipment":"Plate-Loaded Machine","reps":"10-15"},{"name":"Hip Thrust","muscle":"Legs","equipment":"Other","reps":"8-12"},{"name":"Kneeling Cable Crunch","muscle":"Core","equipment":"Other","reps":"8-12"},{"name":"Plank","muscle":"Core","equipment":"Other","reps":"8-12"},{"name":"Hanging Knee Raise","muscle":"Core","equipment":"Other","reps":"8-12"},{"name":"Hanging Leg Raise","muscle":"Core","equipment":"Other","reps":"8-12"},{"name":"Ab Wheel Rollout","muscle":"Core","equipment":"Other","reps":"8-12"},{"name":"Pallof Press","muscle":"Core","equipment":"Other","reps":"8-12"},{"name":"EZ-Bar or Barbell Curl","muscle":"Arms","equipment":"Barbell","reps":"8-12"},{"name":"Back Squat or Hack Squat","muscle":"Legs","equipment":"Barbell","reps":"6-10"},{"name":"Goblet Squat or Leg Press","muscle":"Full Body / Pump","equipment":"Dumbbells","reps":"10-15"},{"name":"Cable Triceps Pressdown","muscle":"Arms","equipment":"Single Cable","reps":"12-15"}]};</script>
<script>
const SEED=window.BRO_SPLIT_SEED, KEY='broSplitV1';
let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(SEED)}catch(e){db=JSON.parse(JSON.stringify(SEED))}
if(!db.plan||!db.history||!db.library){db=JSON.parse(JSON.stringify(SEED))}
if(!db.today)db.today={};if(!db.recent)db.recent=[];if(!db.extras)db.extras=[];if(!Array.isArray(db.measurements))db.measurements=[];
const weekdays=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
let view='today',openIdx=0,selectedDay=weekdays[new Date().getDay()];if(!db.plan[selectedDay])selectedDay='Monday';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function localDateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Unable to save locally. Export a backup and check browser storage.')}}
// Migrate only plan definitions. Never rewrite historical workout records.
function migrate(){let fri=db.plan.Friday?.exercises;if(fri){let i=fri.findIndex(e=>e.name==='Cable Curl + Triceps Pressdown');if(i>=0){let old=fri[i];fri.splice(i,1,{...old,name:'Cable Curl',reps:'12-15',notes:'Optional superset with pressdowns'},{...old,name:'Cable Triceps Pressdown',reps:'12-15',notes:'Optional superset with curls'})}}let mon=db.plan.Monday?.exercises;if(mon){let found=false;db.plan.Monday.exercises=mon.filter(e=>{if(e.name!=='Barbell Bench Press')return true;if(found)return false;found=true;return true})}save()}
migrate();
function lastSets(name){let h=db.history.filter(x=>x.exercise===name);if(!h.length)return[];let d=h.map(x=>x.completedAt||x.date||'').sort().pop();let id=h.find(x=>(x.completedAt||x.date||'')===d)?.workoutId;return h.filter(x=>x.exercise===name&&(id?x.workoutId===id:(x.completedAt||x.date||'')===d)).sort((a,b)=>a.set-b.set)}
function lastText(name){let a=lastSets(name);return a.length?a.map(x=>`${x.weight??'BW'} × ${x.reps}`).join(' | '):'No previous data'}
function rec(ex){let a=lastSets(ex.name);if(!a.length)return'Build baseline';let [lo,hi]=String(ex.reps).split('-').map(Number);if(!Number.isFinite(hi))return'Compare with previous workout';let reps=a.map(x=>+x.reps||0),rpe=a.map(x=>+x.rpe||0).filter(Boolean);if(reps.length&&reps.every(r=>r>=hi-1)&&(!rpe.length||Math.max(...rpe)<=9))return'Increase weight';if(reps.some(r=>r<lo))return'Hold weight / recover';return'Try for more reps'}
function shell(body){return `<div class=shell><div class=top><div class=brand>🏋️ <span>Bro Split</span></div><div class=small>${new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</div></div><div class=nav>${[['today','Today'],['history','History'],['progress','Progress'],['exercises','Exercises'],['measurements','Body'],['settings','Settings']].map(([v,l])=>`<button data-view=${v} class=${view===v?'active':''}>${l}</button>`).join('')}</div>${body}</div>`}
function render(){let body=view==='today'?today():view==='history'?history():view==='progress'?progress():view==='exercises'?library():view==='measurements'?bodyPage():settings();$('#app').innerHTML=shell(body);bind()}
function dayData(){db.today[selectedDay]??={};return db.today[selectedDay]}
function entry(e){let t=dayData();t[e.name]??=Array.from({length:e.sets},()=>({}));return t[e.name]}
function today(){let p=db.plan[selectedDay];let skipped=dayData()._skipped||[];let exs=p.exercises;return `<div class=hero><div><h1>${selectedDay.toUpperCase()}</h1><h2>${esc(p.focus)}</h2></div><div style="min-width:220px"><select id=day class=select>${Object.keys(db.plan).map(d=>`<option ${d===selectedDay?'selected':''}>${d}</option>`).join('')}</select></div></div>${exs.map((e,i)=>skipped.includes(e.name)?'':card(e,i)).join('')}${skipped.length?`<div class=panel><div class=small>Skipped for this workout: ${skipped.map(esc).join(', ')}</div><button class="chip mini" id=restore>Restore skipped exercises</button></div>`:''}<button class="btn add" id=add>＋ Add Exercise</button><button class=btn id=complete>✓ Complete Workout</button>`}
function card(e,i){let prev=lastSets(e.name),t=entry(e),count=Math.max(e.sets,t.length);return `<div class=card><div class=cardhead data-open=${i}><div class=num>${i+1}</div><div><div class=name>${esc(e.name)}</div><div class=small>${count} × ${esc(e.reps)}</div></div><div class=last>Last:<br>${esc(lastText(e.name))}<br><span style="color:#249cff">${i===openIdx?'▲':'▼'}</span></div></div>${i===openIdx?`<div class=detail><div class=recommend>↑ ${rec(e)}</div><div class="setrow labels"><b>Set</b><b>Weight</b><b>Reps</b><b>RPE</b></div>${Array.from({length:count},(_,j)=>`<div class=setrow><b>${j+1}</b><input inputmode=decimal data-f=weight data-i=${j} value="${esc(t[j]?.weight??'')}" placeholder="${esc(prev[j]?.weight??'')}"><input inputmode=numeric data-f=reps data-i=${j} value="${esc(t[j]?.reps??'')}" placeholder="${esc(prev[j]?.reps??'')}"><input inputmode=decimal data-f=rpe data-i=${j} value="${esc(t[j]?.rpe??'')}" placeholder="8"></div>`).join('')}<div class=controls><button class=chip id=super>Superset: ${t[0]?.superset?'Yes':'No'}</button><button class=chip id=addset>＋ Set${count>=4?' (max 4)':''}</button><button class=chip id=replace>Replace Exercise</button><button class="chip skip" id=skip>Skip Today</button></div><textarea id=notes placeholder="Notes (optional)">${esc(t[0]?.notes||'')}</textarea><button class=btn id=saveex>Save Exercise</button></div>`:''}</div>`}
function history(){let ids=[...new Set(db.history.map(x=>x.workoutId||`${x.date}|${x.session||''}`))];let groups=ids.map(id=>{let rows=db.history.filter(x=>(x.workoutId||`${x.date}|${x.session||''}`)===id);return {id,rows,date:rows[0]?.date||'',time:rows[0]?.completedAt||rows[0]?.date||''}}).sort((a,b)=>b.time.localeCompare(a.time));return `<h1>History</h1>${groups.length?'':'<div class=panel>No workouts recorded yet.</div>'}${groups.slice(0,50).map(g=>`<div class=panel><b>${esc(g.date)}</b><div class=small>${esc(g.rows[0]?.session||'Workout')} ${g.rows[0]?.completedAt?' • '+esc(new Date(g.rows[0].completedAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})):''}</div>${[...new Set(g.rows.map(x=>x.exercise))].map(e=>`<div class=historyrow><b>${esc(e)}</b><div class=small>${esc(g.rows.filter(x=>x.exercise===e).sort((a,b)=>a.set-b.set).map(x=>`${x.weight??'BW'}×${x.reps}`).join(' | '))}</div></div>`).join('')}</div>`).join('')}`}
function progress(){let names=[...new Set(db.history.map(x=>x.exercise))].sort();let n=names[0],h=db.history.filter(x=>x.exercise===n);let best=h.reduce((m,x)=>Math.max(m,(+x.weight||0)*(1+(+x.reps||0)/30)),0);return `<h1>Progress</h1><div class=panel><select id=prog class=select>${names.map(x=>`<option>${esc(x)}</option>`).join('')}</select><p class=small>Exercise-specific history is preserved even when you change the program.</p><div class=metric id=best>${Math.round(best)||'—'}</div><div class=small>Best estimated 1RM for selected exercise</div></div><div class=panel><b>Progress</b><p class=small>Detailed trend charts will be in the Excel companion.</p></div>`}
function library(){let groups=[...new Set(db.library.map(x=>x.muscle))];return `<h1>Exercises</h1><input id=search class=search placeholder="Search exercises…">${groups.map(g=>`<div class=panel><b>${esc(g)}</b>${db.library.filter(x=>x.muscle===g).map(x=>`<div class=libitem><span>${esc(x.name)}<div class=small>${esc(x.equipment)} • ${esc(x.reps)}</div></span></div>`).join('')}</div>`).join('')}<button class=btn id=create>＋ Create Exercise</button>`}

function bodyPage(){let rows=[...db.measurements].sort((a,b)=>b.date.localeCompare(a.date));let fields=[['weight','Weight (lb)'],['waist','Waist (in)'],['chest','Chest (in)'],['arm','Arm (in)'],['shoulders','Shoulders (in)'],['thigh','Thigh (in)'],['calf','Calf (in)']];return `<h1>Body Measurements</h1><p class=small>Record measurements whenever you choose; no workout required. Saved locally and included in JSON backups.</p><div class=panel><label class=small>Date</label><input id=bodydate type=date value="${localDateKey()}"><div class=bodygrid>${fields.map(([k,l])=>`<label class=small>${l}<input data-body="${k}" type=number min=0 step=0.1 placeholder="Optional"></label>`).join('')}</div><label class=small>Notes</label><textarea id=bodynotes placeholder="Optional notes"></textarea><button class=btn id=bodySave>Save Measurements</button></div><div class=panel><h2>Measurement History</h2>${rows.length?rows.map(r=>`<div class=historyrow><b>${esc(r.date)}</b><div class=small>${fields.filter(([k])=>r[k]!==null&&r[k]!==undefined).map(([k,l])=>`${esc(l)}: ${esc(r[k])}`).join(' · ')}</div>${r.notes?`<div class=small>${esc(r.notes)}</div>`:''}<button class="chip" data-editbody="${esc(r.date)}">Edit</button></div>`).join(''):'<p class=small>No measurements yet.</p>'}</div>`}
function saveBody(){let date=$('#bodydate').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('Select a valid date');return}let r={date,notes:$('#bodynotes').value.trim()};let any=false;document.querySelectorAll('[data-body]').forEach(x=>{let v=x.value.trim();r[x.dataset.body]=v===''?null:Number(v);if(v!=='')any=true});if(!any){alert('Enter at least one measurement');return}let idx=db.measurements.findIndex(x=>x.date===date);if(idx>=0){if(!confirm('Replace the existing measurements for '+date+'?'))return;db.measurements[idx]=r}else db.measurements.push(r);save();render();toast('Measurements saved')}
function editBody(date){let r=db.measurements.find(x=>x.date===date);if(!r)return;$('#bodydate').value=r.date;$('#bodynotes').value=r.notes||'';document.querySelectorAll('[data-body]').forEach(x=>x.value=r[x.dataset.body]??'');window.scrollTo(0,0)}

function settings(){return `<h1>Settings</h1><div class=panel><b>Data</b><p class=note>Export a backup before importing or updating. Your workout data is stored on this device.</p><button class=btn id=export>Export Backup</button><label class="btn secondary" style="display:block;text-align:center">Import Backup<input id=import type=file accept=.json hidden></label></div><div class=panel><b>About</b><p class=small>Bro Split v1.2 • Local-first workout tracker. History is never removed by program updates.</p></div>`}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});if(view==='today'){$('#day').onchange=e=>{selectedDay=e.target.value;openIdx=0;render()};document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{openIdx=+x.dataset.open;render()});$('#add').onclick=()=>picker('add');$('#complete').onclick=complete;if($('#restore'))$('#restore').onclick=()=>{delete dayData()._skipped;save();render()};let e=db.plan[selectedDay].exercises[openIdx];if(e&&$('#replace')){$('#replace').onclick=()=>picker('replace');$('#saveex').onclick=()=>{save();toast('Exercise saved')};$('#super').onclick=()=>toggleSuper(e);$('#addset').onclick=()=>{let t=entry(e);if(t.length>=4){toast('Maximum four sets');return}t.push({});save();render()};$('#skip').onclick=()=>{let t=dayData();t._skipped??=[];if(!t._skipped.includes(e.name))t._skipped.push(e.name);delete t[e.name];save();openIdx=-1;render()};document.querySelectorAll('[data-f]').forEach(x=>x.oninput=()=>{let t=entry(e);t[+x.dataset.i]??={};t[+x.dataset.i][x.dataset.f]=x.value;save()});$('#notes').oninput=x=>{entry(e).forEach(z=>z.notes=x.target.value);save()}}}if(view==='exercises'){$('#search').oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.libitem').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'flex':'none')};$('#create').onclick=()=>createForm()}if(view==='progress'&&$('#prog'))$('#prog').onchange=e=>{let h=db.history.filter(x=>x.exercise===e.target.value),best=h.reduce((m,x)=>Math.max(m,(+x.weight||0)*(1+(+x.reps||0)/30)),0);$('#best').textContent=Math.round(best)||'—'};if(view==='measurements'){$('#bodySave').onclick=saveBody;document.querySelectorAll('[data-editbody]').forEach(b=>b.onclick=()=>editBody(b.dataset.editbody))}if(view==='settings'){$('#export').onclick=exportData;$('#import').onchange=importData}}
function toggleSuper(e){let t=entry(e),v=!t[0].superset;t.forEach(x=>x.superset=v);save();render()}
function picker(mode){let modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class=sheet><h2>${mode==='add'?'Add':'Replace'} Exercise</h2><input id=picksearch placeholder="Search exercises…"><div id=picklist>${db.library.map((x,i)=>`<div class=libitem data-pick=${i}><span><b>${esc(x.name)}</b><div class=small>${esc(x.muscle)} • ${esc(x.equipment)}</div></span><span>＋</span></div>`).join('')}</div><button class="btn secondary" id=newx>＋ Create New Exercise</button><button class="btn secondary" id=cancel>Cancel</button></div>`;document.body.append(modal);modal.querySelector('#cancel').onclick=()=>modal.remove();modal.querySelector('#picksearch').oninput=e=>modal.querySelectorAll('[data-pick]').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'flex':'none');modal.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>choose(mode,db.library[+x.dataset.pick],modal));modal.querySelector('#newx').onclick=()=>{modal.remove();createForm(mode)}}
function choose(mode,x,modal){let e={name:x.name,equipment:x.equipment,setup:'',sets:3,reps:x.reps,rpe:'8-9',rir:'1-2',rest:60,notes:''};if(mode==='add'){if(db.plan[selectedDay].exercises.some(y=>y.name===x.name)){modal.remove();toast('Exercise already in this day');return}db.plan[selectedDay].exercises.push(e);db.recent.unshift(x.name);save();modal.remove();openIdx=db.plan[selectedDay].exercises.length-1;render();return}modal.querySelector('.sheet').innerHTML=`<h2>${esc(x.name)}</h2><p class=small>${esc(x.muscle)} • ${esc(x.equipment)}</p><button class=btn id=todayonly>Just Today</button><button class="btn secondary" id=program>Update Program</button><button class="btn secondary" id=cancel2>Cancel</button>`;modal.querySelector('#todayonly').onclick=()=>{let old=db.plan[selectedDay].exercises[openIdx];db.plan[selectedDay].exercises[openIdx]={...e,_temporaryOriginal:old};save();modal.remove();render()};modal.querySelector('#program').onclick=()=>{db.plan[selectedDay].exercises[openIdx]=e;save();modal.remove();render()};modal.querySelector('#cancel2').onclick=()=>modal.remove()}
function createForm(mode='add'){let modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class=sheet><h2>Create Exercise</h2><input id=xname placeholder="Exercise name"><div class=row2><select id=xmus class=select>${['Chest','Back','Shoulders','Arms','Legs','Core'].map(x=>`<option>${x}</option>`).join('')}</select><input id=xeq placeholder="Equipment"></div><div class=row2><input id=xlo inputmode=numeric placeholder="Min reps e.g. 8"><input id=xhi inputmode=numeric placeholder="Max reps e.g. 12"></div><button class=btn id=xsave>Create Exercise</button><button class="btn secondary" id=xcancel>Cancel</button></div>`;document.body.append(modal);modal.querySelector('#xcancel').onclick=()=>modal.remove();modal.querySelector('#xsave').onclick=()=>{let x={name:modal.querySelector('#xname').value.trim(),muscle:modal.querySelector('#xmus').value,equipment:modal.querySelector('#xeq').value.trim()||'Other',reps:`${modal.querySelector('#xlo').value||8}-${modal.querySelector('#xhi').value||12}`};if(!x.name)return;if(!db.library.some(z=>z.name===x.name))db.library.push(x);save();modal.remove();picker(mode)}}
function complete(){let entries=dayData(),now=new Date(),date=localDateKey(now),completedAt=now.toISOString(),workoutId=`${date}-${now.getTime()}-${Math.random().toString(36).slice(2,8)}`,newRows=[];Object.entries(entries).forEach(([exercise,sets])=>{if(!Array.isArray(sets))return;sets.forEach((s,i)=>{if(s.reps!==''&&s.reps!=null&&Number(s.reps)>0)newRows.push({date,completedAt,workoutId,session:db.plan[selectedDay].focus,exercise,set:i+1,weight:s.weight!==''&&s.weight!=null?+s.weight:null,reps:+s.reps,rpe:s.rpe!==''&&s.rpe!=null?+s.rpe:null,notes:s.notes||'',superset:s.superset?'Yes':'No'})})});if(!newRows.length){toast('Enter reps before completing');return}db.history.push(...newRows);db.plan[selectedDay].exercises=db.plan[selectedDay].exercises.map(e=>e._temporaryOriginal||e);delete db.today[selectedDay];save();toast(`Saved ${newRows.length} sets to History ✓`);render()}
function exportData(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=url;a.download=`bro-split-backup-${localDateKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!data||!data.plan||!Array.isArray(data.history)||!Array.isArray(data.library))throw Error('Invalid structure');if(!confirm(`Import ${data.history.length} workout sets? This replaces current local data. Export your current backup first.`))return;db=data;db.today??={};db.recent??=[];db.extras??=[];db.measurements=Array.isArray(db.measurements)?db.measurements:[];migrate();render();toast('Backup imported')}catch(e){alert('Invalid backup file: '+e.message)}};r.readAsText(f)}
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2200)}
render();
</script>
</body></html>
